name: Windows RDP with Tailscale & Audio (Fixed)

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: 'Chọn phiên bản hệ điều hành'
        required: true
        default: 'windows-2022'
        type: choice
        options:
          - windows-2022
          - windows-2025

jobs:
  rdp:
    runs-on: ${{ inputs.os_version }}
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Cài đặt và Kết nối Tailscale VPN trên Windows
        run: |
          try {
              Write-Host "Đang cài đặt Tailscale qua Chocolatey..."
              choco install tailscale -y --no-progress
              
              $tailscalePath = "C:\Program Files\Tailscale"
              if (Test-Path "$tailscalePath\tailscale.exe") {
                  $env:Path += ";$tailscalePath"
              }
              
              Write-Host "Đang khởi động dịch vụ Tailscale..."
              Start-Service Tailscale -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 3
              
              Write-Host "Đang xác thực Tailscale bằng AuthKey..."
              & "$tailscalePath\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --hostname="github-rdp-${{ inputs.os_version }}" --accept-routes
              
              Write-Host "✅ Kết nối Tailscale thành công!" -ForegroundColor Green
          } catch {
              Write-Error "❌ LỖI TAILSCALE: $_"
              exit 1
          }
        shell: powershell

      - name: 2. Kích hoạt Remote Desktop (RDP) & Firewall
        run: |
          try {
              Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -ErrorAction Stop
              Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -ErrorAction Stop
              Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction Stop
              Write-Host "✅ Đã bật RDP và Firewall thành công!" -ForegroundColor Green
          } catch {
              Write-Error "❌ LỖI BẬT RDP: $_"
              exit 1
          }
        shell: powershell

      - name: 3. Bật dịch vụ Âm thanh & Micro
        run: |
          try {
              Set-Service -Name Audiosrv -StartupType Automatic -ErrorAction Stop
              Start-Service Audiosrv -ErrorAction Stop
              Set-Service -Name AudioEndpointBuilder -StartupType Automatic -ErrorAction Stop
              Start-Service AudioEndpointBuilder -ErrorAction Stop
              Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "fDisableAudio" -Value 0 -ErrorAction Stop
              Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "fDisableAudioCapture" -Value 0 -ErrorAction Stop
              Write-Host "✅ Đã bật Audio & Micro thành công!" -ForegroundColor Green
          } catch {
              Write-Warning "⚠️ Cảnh báo khi cấu hình Audio: $_"
          }
        shell: powershell

      - name: 4. Thiết lập tài khoản quản trị viên
        run: |
          try {
              $password = "RDP@Password2026!"
              net user runneradmin $password /active:yes
              Write-Host "✅ Đã thiết lập tài khoản runneradmin thành công!" -ForegroundColor Green
          } catch {
              Write-Error "❌ LỖI TẠO TÀI KHOẢN: $_"
              exit 1
          }
        shell: powershell

      - name: 5. Tải và cài đặt hình nền tối ưu
        run: |
          $fileId = "11XJAKWIWRKl5xuvto9PQzT6frKFt7UyL"
          $wallpaperUrl = "https://drive.google.com/uc?export=download&id=$fileId"
          $outputPath = "$env:TEMP\wallpaper.jpg"
          try {
              Invoke-WebRequest -Uri $wallpaperUrl -OutFile $outputPath -ErrorAction Stop
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name Wallpaper -Value $outputPath
              rundll32.exe user32.dll, UpdatePerUserSystemParameters
              Write-Host "✅ Đã áp dụng hình nền thành công!" -ForegroundColor Green
          } catch {
              Write-Warning "⚠️ Không tải được hình nền từ Google Drive. Dùng giao diện mặc định."
          }
        shell: powershell

      - name: 6. Tối ưu hóa hiệu năng máy ảo mượt mà
        run: |
          try {
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'UserPreferencesMask' -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00))
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' -Name 'Win32PrioritySeparation' -Value 38
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop\WindowMetrics' -Name 'MinAnimate' -Value 0
              Write-Host "✅ Đã tối ưu hiệu năng mượt mà!" -ForegroundColor Green
          } catch {
              Write-Warning "⚠️ Lỗi nhỏ khi tối ưu giao diện: $_"
          }
        shell: powershell

      - name: 7. Lấy IP Tailscale và Hiển thị thông tin kết nối
        run: |
          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          Write-Host "Đang chờ Tailscale cấp phát IP..."
          Start-Sleep -Seconds 8
          
          Start-Service Tailscale -ErrorAction SilentlyContinue
          $tsIp = & $tsPath ip -4 2>$null
          
          if (-not $tsIp) {
              Write-Host "Đang thử kích hoạt lại kết nối..."
              & $tsPath up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --accept-routes 2>$null
              Start-Sleep -Seconds 5
              $tsIp = & $tsPath ip -4 2>$null
          }

          if (-not $tsIp) {
              # Fallback sang IP cục bộ nếu Tailscale chưa kịp phản hồi
              $tsIp = (Get-NetIPAddress -AddressFamily IPv4 -InterfaceIndex $(Get-NetConnectionProfile | Select-Object -ExpandProperty InterfaceIndex) | Select-Object -First 1).IPAddress
          }

          $connectionString = "$tsIp:3389"
          $password = "RDP@Password2026!"

          Write-Host "============================================================"
          Write-Host " 🎉 MÁY ẢO RDP ĐÃ SẴN SÀNG SỬ DỤNG!" -ForegroundColor Green
          Write-Host " 🌐 Địa chỉ IP kết nối : $connectionString" -ForegroundColor Yellow
          Write-Host " 👤 Tài khoản          : runneradmin" -ForegroundColor Cyan
          Write-Host " 🔒 Mật khẩu           : $password" -ForegroundColor Cyan
          Write-Host "============================================================"
        shell: powershell

      - name: 8. Duy trì phiên hoạt động
        run: |
          Write-Host "Máy ảo đang chạy qua Tailscale. Giữ kết nối trong 6 giờ..."
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
          }
        shell: powershell
