name: Windows RDP with Tailscale, Audio & Discord Bot

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: 'Chọn phiên bản hệ điều hành'
        required: true
        default: 'windows-2022'
        type: choice
        options:
          - windows-2022
          - windows-2025
      discord_token:
        description: 'Dán Discord Bot Token vào đây'
        required: true
        default: ''
        type: string
      discord_channel:
        description: 'Dán ID Kênh (Channel ID) Discord vào đây'
        required: true
        default: ''
        type: string

jobs:
  rdp:
    runs-on: ${{ inputs.os_version }}
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Kết nối mạng Tailscale VPN
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --hostname=github-rdp-${{ inputs.os_version }}

      - name: 2. Kích hoạt Remote Desktop (RDP) & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        shell: powershell

      - name: 3. Bật dịch vụ Âm thanh & Micro
        run: |
          Set-Service -Name Audiosrv -StartupType Automatic
          Start-Service Audiosrv
          Set-Service -Name AudioEndpointBuilder -StartupType Automatic
          Start-Service AudioEndpointBuilder
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "fDisableAudio" -Value 0
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "fDisableAudioCapture" -Value 0
        shell: powershell

      - name: 4. Thiết lập tài khoản quản trị viên
        run: |
          $password = "RDP@Password2026!"
          net user runneradmin $password
        shell: powershell

      - name: 5. Tải và cài đặt hình nền từ Google Drive
        run: |
          $fileId = "11XJAKWIWRKl5xuvto9PQzT6frKFt7UyL"
          $wallpaperUrl = "https://drive.google.com/uc?export=download&id=$fileId"
          $outputPath = "$env:TEMP\wallpaper.jpg"
          try {
            Invoke-WebRequest -Uri $wallpaperUrl -OutFile$outputPath -ErrorAction Stop
            Add-Type -TypeDefinition @"
            using System;
            using System.Runtime.InteropServices;
            public class Wallpaper {
                [DllImport("user32.dll", CharSet = CharSet.Auto)]
                public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni);
            }
            "@
            [Wallpaper]::SystemParametersInfo(20, 0, $outputPath, 3)
          } catch {
            Write-Warning "Không thể tải hình nền trực tiếp, dùng mặc định."
          }
        shell: powershell

      - name: 6. Tối ưu hóa hiệu năng máy ảo mượt mà
        run: |
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'UserPreferencesMask' -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00))
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' -Name 'Win32PrioritySeparation' -Value 38
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop\WindowMetrics' -Name 'MinAnimate' -Value 0
        shell: powershell

      - name: 7. Lấy IP Tailscale và Gửi thông tin qua Discord Bot
        env:
          INPUT_TOKEN: ${{ inputs.discord_token }}
          INPUT_CHANNEL: ${{ inputs.discord_channel }}
          OS_NAME: ${{ inputs.os_version }}
        run: |
          $tsIp = (tailscale ip -4)
          $connectionString = "$tsIp:3389"
          $password = "RDP@Password2026!"
          
          if ("${{ env.INPUT_TOKEN }}" -ne "" -and "${{ env.INPUT_CHANNEL }}" -ne "") {
              Write-Host "Đang gửi thông tin menu máy ảo qua Discord Bot..."
              
              $ipFormatted = '`' + $connectionString + '`'
              $userFormatted = '`runneradmin`'
              $passFormatted = '`' + $password + '`'

              $body = @{
                  embeds = @(
                      @{
                          title = "🖥️ GitHub Windows RDP - Trạng Thái Hoạt Động"
                          description = "Máy ảo RDP của anh **TrKiên (Kiendz)** đã sẵn sàng sử dụng!"
                          color = 3066993
                          fields = @(
                              @{ name = "💻 Hệ điều hành"; value = "$env:OS_NAME"; inline = $true },
                              @{ name = "👤 Chủ sở hữu"; value = "TrKiên"; inline = $true },
                              @{ name = "🌐 Địa chỉ IP (Tailscale)"; value = $ipFormatted; inline =$false },
                              @{ name = "🔑 Tài khoản"; value = $userFormatted; inline =$true },
                              @{ name = "🔒 Mật khẩu"; value = $passFormatted; inline =$true },
                              @{ name = "🔊 Âm thanh & Micro"; value = "Đã kích hoạt hoạt động mượt mà"; inline = $false }
                          )
                          footer = @{ text = "Tailscale Secure P2P • Tối ưu hóa không giật lag" }
                      }
                  )
              } | ConvertTo-Json -Depth 5

              $headers = @{
                  "Authorization" = "Bot ${{ env.INPUT_TOKEN }}"
                  "Content-Type"  = "application/json"
              }

              $discordUrl = "https://discord.com/api/v10/channels/${{ env.INPUT_CHANNEL }}/messages"
              
              try {
                  Invoke-RestMethod -Uri $discordUrl -Method Post -Headers $headers -Body$body
                  Write-Host "Gửi thông tin qua Discord thành công!"
              } catch {
                  Write-Warning "Không thể gửi tin nhắn Discord. Hãy kiểm tra lại Bot Token và ID Kênh!"
              }
          } else {
              Write-Warning "Chưa nhập Token hoặc ID Kênh Discord, bỏ qua bước gửi tin nhắn."
          }

          Write-Host "============================================================"
          Write-Host " KẾT NỐI TAILSCALE THÀNH CÔNG!" -ForegroundColor Green
          Write-Host " Địa chỉ IP kết nối (RDP) -> $connectionString" -ForegroundColor Yellow
          Write-Host "============================================================"
        shell: powershell

      - name: 8. Duy trì phiên hoạt động
        run: |
          Write-Host "Máy ảo đang chạy qua Tailscale. Giữ kết nối trong 6 giờ..."
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
          }
        shell: powershell
