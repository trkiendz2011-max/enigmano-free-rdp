name: Windows RDP Stable & Safe

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: 'Chọn phiên bản hệ điều hành'
        required: true
        default: 'windows-2022'
        type: choice
        options:
          - windows-2022
          - windows-2025

jobs:
  rdp:
    runs-on: ${{ inputs.os_version }}
    timeout-minutes: 360

    steps:
      - name: 0. Kiểm tra secrets
        shell: pwsh
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          $names = @()
          try { $names = @(($env:ALL_SECRETS | ConvertFrom-Json).PSObject.Properties.Name) } catch { }
          $visible = ($names | Where-Object { $_ -ne 'github_token' }) -join ', '
          if (-not $visible) { $visible = '(không có secret nào)' }
          Write-Host "Secret mà run này nhìn thấy: $visible"

          $missing = @('TAILSCALE_AUTHKEY', 'RDP_PASSWORD') | Where-Object { $names -notcontains $_ }
          if ($missing) {
              Write-Host "::error title=Thiếu secret::Thiếu: $($missing -join ', '). Run này chỉ thấy: $visible. Tạo đúng tên ở Settings > Secrets and variables > Actions > Repository secrets (không phải tab Dependabot hay Codespaces)."
              exit 1
          }
          Write-Host "✅ Đủ secret cần thiết."

      - name: 1. Cài đặt và kết nối Tailscale VPN
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Continue"
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
              Write-Host "::error title=Thiếu secret::Chưa có secret TAILSCALE_AUTHKEY trong Repository secrets của repo này."
              exit 1
          }

          Write-Host "Đang cài đặt Tailscale..."
          choco install tailscale -y --no-progress --limit-output
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
              Write-Host "::error title=Tailscale::Cài đặt thất bại (choco exit code $LASTEXITCODE)"
              exit 1
          }

          Write-Host "Đợi dịch vụ Tailscale sẵn sàng..."
          for ($i = 1; $i -le 20; $i++) {
              $svc = Get-Service Tailscale -ErrorAction SilentlyContinue
              if ($svc -and $svc.Status -eq 'Running') { break }
              if ($svc) { Start-Service Tailscale -ErrorAction SilentlyContinue }
              Start-Sleep -Seconds 2
          }
          Start-Sleep -Seconds 3

          $upCode = 1
          $upOutput = $null
          for ($attempt = 1; $attempt -le 3 -and $upCode -ne 0; $attempt++) {
              Write-Host "Xác thực Tailscale, lần $attempt/3..."
              $upOutput = & $ts up --authkey="$env:TS_AUTHKEY" --hostname="gh-rdp-$env:GITHUB_RUN_ID" --unattended --reset --timeout=60s 2>&1
              $upCode = $LASTEXITCODE
              $upOutput | ForEach-Object { Write-Host "$_" }
              if ($upCode -ne 0) { Start-Sleep -Seconds 8 }
          }

          if ($upCode -ne 0) {
              Write-Host "---- Chẩn đoán ----"
              Get-Service Tailscale -ErrorAction SilentlyContinue | Format-List Name, Status, StartType | Out-String | Write-Host
              & $ts status 2>&1 | ForEach-Object { Write-Host "$_" }
              $detail = (($upOutput | Out-String).Trim()) -replace '\r?\n', ' | '
              Write-Host "::error title=Tailscale up::exit $upCode. $detail"
              exit 1
          }
          Write-Host "✅ Tailscale đã kết nối!" -ForegroundColor Green

      - name: 2. Kích hoạt Remote Desktop và Firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Set-Service -Name TermService -StartupType Automatic
          Start-Service TermService -ErrorAction SilentlyContinue

          try {
              Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          } catch {
              New-NetFirewallRule -DisplayName "RDP-3389" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow | Out-Null
          }
          Write-Host "✅ Đã bật RDP!" -ForegroundColor Green

      - name: 3. Bật dịch vụ Âm thanh và Micro
        shell: pwsh
        run: |
          try {
              Set-Service -Name Audiosrv -StartupType Automatic
              Set-Service -Name AudioEndpointBuilder -StartupType Automatic
              Start-Service AudioEndpointBuilder -ErrorAction SilentlyContinue
              Start-Service Audiosrv -ErrorAction SilentlyContinue

              $tsPolicy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
              if (-not (Test-Path $tsPolicy)) { New-Item -Path $tsPolicy -Force | Out-Null }
              New-ItemProperty -Path $tsPolicy -Name "fDisableAudio" -Value 0 -PropertyType DWord -Force | Out-Null
              New-ItemProperty -Path $tsPolicy -Name "fDisableAudioCapture" -Value 0 -PropertyType DWord -Force | Out-Null
              Write-Host "✅ Đã bật Audio & Micro!" -ForegroundColor Green
          } catch {
              Write-Warning "⚠️ Bỏ qua lỗi Audio: $_"
          }

      - name: 4. Thiết lập tài khoản quản trị viên
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              Write-Host "::error title=Thiếu secret::Chưa có secret RDP_PASSWORD trong repo này."
              exit 1
          }
          $ErrorActionPreference = "Continue"
          $netResult = net user runneradmin "$env:RDP_PASSWORD" /active:yes 2>&1
          $netCode = $LASTEXITCODE
          if ($netCode -ne 0) {
              Write-Host "::error title=net user::Đặt mật khẩu thất bại: $netResult (mật khẩu cần đủ độ phức tạp)"
              exit 1
          }
          net localgroup "Remote Desktop Users" runneradmin /add 2>&1 | Out-Null
          Write-Host "✅ Đã cấu hình tài khoản runneradmin!" -ForegroundColor Green

      - name: 5. Tải hình nền
        shell: pwsh
        run: |
          $fileId = "11XJAKWIWRKl5xuvto9PQzT6frKFt7UyL"
          $url = "https://drive.google.com/uc?export=download&id=$fileId"
          $out = "$env:TEMP\wallpaper.jpg"
          try {
              Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing -ErrorAction Stop
              if ((Get-Item $out).Length -lt 10240) { throw "File tải về không phải ảnh hợp lệ" }

              $sig = '[DllImport("user32.dll", CharSet = CharSet.Auto)] public static extern int SystemParametersInfo(int a, int b, string c, int d);'
              Add-Type -MemberDefinition $sig -Name Native -Namespace Wall
              [Wall.Native]::SystemParametersInfo(20, 0, $out, 3) | Out-Null
              Write-Host "✅ Đã áp dụng hình nền!" -ForegroundColor Green
          } catch {
              Write-Warning "⚠️ Không đặt được hình nền, dùng mặc định: $_"
          }

      - name: 6. Tối ưu hiệu năng
        shell: pwsh
        run: |
          try {
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'UserPreferencesMask' -Type Binary -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00))
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' -Name 'Win32PrioritySeparation' -Value 38
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop\WindowMetrics' -Name 'MinAnimate' -Value '0'
              Write-Host "✅ Đã tối ưu hiệu năng!" -ForegroundColor Green
          } catch {
              Write-Warning "⚠️ Bỏ qua lỗi tối ưu: $_"
          }

      - name: 7. Hiển thị thông tin kết nối RDP
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $ip = $null
          for ($i = 1; $i -le 10 -and -not $ip; $i++) {
              Start-Sleep -Seconds 3
              $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
          }
          if (-not $ip) {
              Write-Error "❌ Không lấy được IP Tailscale, không thể kết nối từ ngoài"
              exit 1
          }

          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host " 🎉 MÁY ẢO RDP ĐÃ SẴN SÀNG!" -ForegroundColor Green
          Write-Host " 🌐 Địa chỉ  : ${ip}:3389" -ForegroundColor Yellow
          Write-Host " 👤 Tài khoản: runneradmin" -ForegroundColor Cyan
          Write-Host " 🔒 Mật khẩu : (secret RDP_PASSWORD)" -ForegroundColor Cyan
          Write-Host "============================================================" -ForegroundColor Cyan

      - name: 8. Duy trì phiên hoạt động
        shell: pwsh
        run: |
          Write-Host "Máy ảo đang duy trì hoạt động..."
          for ($i = 1; $i -le 340; $i++) {
              Start-Sleep -Seconds 60
          }

      - name: 9. Dọn dẹp Tailscale
        if: always()
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (Test-Path $ts) { & $ts logout 2>$null }

