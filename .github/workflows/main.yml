name: Cloud PC TrKien - Windows RDP + Tailscale + Audio

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: "Chọn phiên bản Windows Runner"
        required: true
        default: "windows-2022"
        type: choice
        options:
          - windows-2022
          - windows-2025

jobs:
  rdp:
    runs-on: ${{ inputs.os_version }}
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CHECK RUNNER
      # ============================================================
      - name: "1. Kiểm tra Windows Runner"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " Windows Runner"
          Write-Host "=============================================="

          Write-Host "Computer : $env:COMPUTERNAME"
          Write-Host "OS       : $((Get-CimInstance Win32_OperatingSystem).Caption)"
          Write-Host "Version  : $((Get-CimInstance Win32_OperatingSystem).Version)"

      # ============================================================
      # 2. INSTALL TAILSCALE
      # ============================================================
      - name: "2. Cài đặt Tailscale"
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Đang kiểm tra Tailscale..."

          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsPath)) {
              Write-Host "Chưa có Tailscale. Đang cài đặt..."

              choco install tailscale -y --no-progress

              Start-Sleep -Seconds 5
          }

          if (-not (Test-Path $tsPath)) {
              throw "Không tìm thấy tailscale.exe sau khi cài đặt."
          }

          Write-Host "Tailscale: $tsPath"

          # Đảm bảo service tồn tại
          $service = Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue

          if (-not $service) {
              throw "Windows service Tailscale không tồn tại."
          }

          Set-Service -Name "Tailscale" -StartupType Automatic

          if ($service.Status -ne "Running") {
              Start-Service -Name "Tailscale"
          }

          Start-Sleep -Seconds 5

          Write-Host "Kiểm tra Tailscale version..."
          & $tsPath version

      # ============================================================
      # 3. CONNECT TAILSCALE
      # ============================================================
      - name: "3. Kết nối Tailscale"
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
              throw "Secret TAILSCALE_AUTHKEY chưa được cấu hình."
          }

          Write-Host "Đang kết nối Tailscale..."

          & $tsPath up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="github-rdp-${{ inputs.os_version }}" `
            --accept-routes

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale up thất bại. ExitCode=$LASTEXITCODE"
          }

          Start-Sleep -Seconds 5

          Write-Host "Tailscale status:"
          & $tsPath status

      # ============================================================
      # 4. ENABLE RDP
      # ============================================================
      - name: "4. Bật Remote Desktop"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Đang bật RDP..."

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          # Đảm bảo TermService chạy
          Set-Service -Name "TermService" -StartupType Automatic

          if ((Get-Service -Name "TermService").Status -ne "Running") {
              Start-Service -Name "TermService"
          }

          # Firewall RDP
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "RDP đã được bật."

      # ============================================================
      # 5. AUDIO
      # ============================================================
      - name: "5. Bật Audio và Micro"
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Đang cấu hình Audio..."

          foreach ($serviceName in @(
              "Audiosrv",
              "AudioEndpointBuilder"
          )) {

              $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue

              if ($service) {
                  Set-Service `
                    -Name $serviceName `
                    -StartupType Automatic `
                    -ErrorAction SilentlyContinue

                  Start-Service `
                    -Name $serviceName `
                    -ErrorAction SilentlyContinue
              }
          }

          $tsPolicy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"

          if (-not (Test-Path $tsPolicy)) {
              New-Item -Path $tsPolicy -Force | Out-Null
          }

          # Audio redirection
          New-ItemProperty `
            -Path $tsPolicy `
            -Name "fDisableAudio" `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          # Microphone redirection
          New-ItemProperty `
            -Path $tsPolicy `
            -Name "fDisableAudioCapture" `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          Write-Host "Audio/Micro đã được cấu hình."

      # ============================================================
      # 6. CREATE RDP USER
      # ============================================================
      - name: "6. Thiết lập tài khoản RDP"
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "Secret RDP_PASSWORD chưa được cấu hình."
          }

          $username = "runneradmin"

          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existingUser) {

              Write-Host "Tài khoản $username đã tồn tại."

              $securePassword = ConvertTo-SecureString `
                $env:RDP_PASSWORD `
                -AsPlainText `
                -Force

              Set-LocalUser `
                -Name $username `
                -Password $securePassword

              Enable-LocalUser -Name $username

          } else {

              Write-Host "Đang tạo tài khoản $username..."

              $securePassword = ConvertTo-SecureString `
                $env:RDP_PASSWORD `
                -AsPlainText `
                -Force

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -UserMayNotChangePassword `
                -Description "RDP account for GitHub Windows runner"

          }

          # Thêm vào Administrators
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          # Thêm vào Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "Tài khoản RDP đã sẵn sàng."

      # ============================================================
      # 7. OPTIMIZE WINDOWS
      # ============================================================
      - name: "7. Tối ưu hiệu năng Windows"
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          try {
              Set-ItemProperty `
                -Path "HKCU:\Control Panel\Desktop" `
                -Name "UserPreferencesMask" `
                -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00))

              Set-ItemProperty `
                -Path "HKCU:\Control Panel\Desktop\WindowMetrics" `
                -Name "MinAnimate" `
                -Value 0

              Set-ItemProperty `
                -Path "HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl" `
                -Name "Win32PrioritySeparation" `
                -Value 38

              Write-Host "Tối ưu hiệu năng hoàn tất."
          }
          catch {
              Write-Warning "Một số thiết lập tối ưu không áp dụng được: $_"
          }

      # ============================================================
      # 8. GET TAILSCALE IP - FIXED
      # ============================================================
      - name: "8. Lấy Tailscale IPv4"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsPath)) {
              throw "Không tìm thấy tailscale.exe."
          }

          Write-Host "=============================================="
          Write-Host " ĐANG CHỜ TAILSCALE CẤP IP"
          Write-Host "=============================================="

          $tsIp = $null

          # Thử tối đa 60 lần = khoảng 2 phút
          for ($i = 1; $i -le 60; $i++) {

              Write-Host "Lần kiểm tra $i/60..."

              try {
                  $rawIp = & $tsPath ip -4 2>$null

                  if ($rawIp) {

                      $candidate = (
                          $rawIp |
                          ForEach-Object { $_.ToString().Trim() } |
                          Where-Object {
                              $_ -match '^(100\.)'
                          } |
                          Select-Object -First 1
                      )

                      if ($candidate) {
                          $tsIp = $candidate
                          break
                      }
                  }
              }
              catch {
                  Write-Warning "Chưa lấy được IP: $_"
              }

              Start-Sleep -Seconds 2
          }

          if ([string]::IsNullOrWhiteSpace($tsIp)) {

              Write-Host ""
              Write-Host "Không lấy được IP bằng 'tailscale ip -4'."
              Write-Host "Đang kiểm tra status..."

              & $tsPath status

              Write-Host ""
              Write-Host "Đang thử lấy IP trực tiếp từ adapter Tailscale..."

              $adapterIp = Get-NetIPAddress `
                -AddressFamily IPv4 `
                -ErrorAction SilentlyContinue |
                Where-Object {
                    $_.IPAddress -match '^100\.'
                } |
                Select-Object -ExpandProperty IPAddress -First 1

              if ($adapterIp) {
                  $tsIp = $adapterIp
              }
          }

          if ([string]::IsNullOrWhiteSpace($tsIp)) {
              throw "KHÔNG THỂ LẤY TAILSCALE IPv4."
          }

          # Loại bỏ khoảng trắng / newline
          $tsIp = $tsIp.Trim()

          # Kiểm tra IP hợp lệ
          if ($tsIp -notmatch '^100\.(\d{1,3}\.){2}\d{1,3}$') {
              throw "IP Tailscale không hợp lệ: [$tsIp]"
          }

          # QUAN TRỌNG:
          # Dùng ${tsIp}:3389 để PowerShell không hiểu sai dấu :
          $connectionString = "${tsIp}:3389"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "             WINDOWS RDP ĐÃ SẴN SÀNG"
          Write-Host "============================================================"
          Write-Host " OS              : ${{ inputs.os_version }}"
          Write-Host " Tailscale IPv4  : $tsIp"
          Write-Host " RDP Address     : $connectionString"
          Write-Host " Username        : runneradmin"
          Write-Host "============================================================"
          Write-Host ""

          # Ghi ra GitHub Actions Summary
          @"
          ## 🖥️ Cloud PC TrKien

          | Thông tin | Giá trị |
          |---|---|
          | OS | `${{ inputs.os_version }}` |
          | Tailscale IPv4 | `$tsIp` |
          | RDP Address | `$connectionString` |
          | Username | `runneradmin` |
          | Port | `3389` |

          **Mật khẩu:** dùng giá trị của secret `RDP_PASSWORD`.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # ============================================================
      # 9. KEEP RUNNER ALIVE
      # ============================================================
      - name: "9. Duy trì Cloud PC"
        shell: powershell
        run: |
          Write-Host "=============================================="
          Write-Host " Cloud PC đang hoạt động"
          Write-Host " Thời gian tối đa: 6 giờ"
          Write-Host "=============================================="

          for ($i = 1; $i -le 360; $i++) {

              $minutesLeft = 360 - $i

              Write-Host "[$i/360] Cloud PC đang chạy - còn khoảng $minutesLeft phút."

              Start-Sleep -Seconds 60
          }

          Write-Host "Thời gian runner đã hết."

🔑 Cần tạo thêm 2 Secrets

Trong repository vào Settings → Secrets and variables → Actions → New repository secret:

Secret| Giá trị
"TAILSCALE_AUTHKEY"| Auth key Tailscale của bạn
"RDP_PASSWORD"| Mật khẩu RDP bạn tự đặt

Không còn hard-code mật khẩu RDP trong YAML, nên log Actions cũng không phải chứa mật khẩu.

🛠️ Lỗi IP đã sửa

Điểm quan trọng nhất là đoạn cũ:

$connectionString = "$tsIp:3389"

đã đổi thành:

$connectionString = "${tsIp}:3389"

Ngoài ra bản mới:

- Chờ Tailscale tối đa 120 giây thay vì ngủ cố định 8 giây.
- Kiểm tra IP phải thuộc dải 100.x.x.x của Tailscale.
- Nếu CLI không trả IP, thử lấy trực tiếp từ adapter mạng Tailscale.
- Không fallback sang IP LAN, vì IP LAN không giúp kết nối RDP qua Tailscale.
- Kiểm tra "tailscale.exe" tồn tại trước khi chạy.
- Kiểm tra "Tailscale" service.
- Bật "TermService" và firewall RDP.
- Tạo "runneradmin" và thêm vào Administrators + Remote Desktop Users.
- Ghi địa chỉ RDP vào GitHub Actions Summary.
- Dùng "RDP_PASSWORD" secret thay cho mật khẩu viết thẳng trong file.

Lưu ý: GitHub-hosted runner là máy tạm thời; khi job kết thúc hoặc runner bị thu hồi thì phiên RDP cũng mất.
