name: Windows RDP Minimal Stable

on:
  workflow_dispatch:
    inputs:
      tailscale_authkey:
        description: 'Tailscale Auth Key'
        required: true
      discord_channel_id:
        description: 'Discord Channel ID'
        required: true
        default: '1413508445323133001'
      discord_token:
        description: 'Discord Bot Token'
        required: true
      rdp_password:
        description: 'RDP Password'
        required: true
        default: 'KienDz@2026'

jobs:
  rdp-runner:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: 1. Setup System & User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ inputs.rdp_password }}
        run: |
          # --- Bật Remote Desktop (giữ NLA) + cho phép mic qua RDP ---
          function Set-Reg($path, $name, $value) {
              if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
              Set-ItemProperty -Path $path -Name $name -Value $value -Type DWord
          }
          $tsKey  = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
          $rdpKey = "$tsKey\WinStations\RDP-Tcp"
          Set-Reg $tsKey  'fDenyTSConnections'   0
          Set-Reg $rdpKey 'UserAuthentication'   1
          Set-Reg $rdpKey 'fDisableAudioCapture' 0
          Set-Reg 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' 'fDisableAudioCapture' 0

          # --- Bật service RDP + Audio ---
          foreach ($svc in 'TermService', 'AudioEndpointBuilder', 'Audiosrv') {
              Set-Service -Name $svc -StartupType Automatic -ErrorAction SilentlyContinue
              Start-Service -Name $svc -ErrorAction SilentlyContinue
          }

          # --- Firewall: rule RDP mặc định + rule riêng cho dải IP Tailscale ---
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          if (-not (Get-NetFirewallRule -DisplayName 'RDP-Tailscale' -ErrorAction SilentlyContinue)) {
              $fw = @{
                  DisplayName   = 'RDP-Tailscale'
                  Direction     = 'Inbound'
                  Protocol      = 'TCP'
                  LocalPort     = 3389
                  RemoteAddress = '100.64.0.0/10'
                  Action        = 'Allow'
                  Profile       = 'Any'
              }
              New-NetFirewallRule @fw | Out-Null
          }

          # --- Đặt mật khẩu cho runneradmin (sai policy thì báo lỗi rõ ràng) ---
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { throw 'rdp_password is empty' }
          $secure = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name 'runneradmin' -Password $secure
          Write-Host 'RDP enabled, runneradmin password set.'

      - name: 2. Tailscale Setup
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ inputs.tailscale_authkey }}
          hostname: cloudtrkien

      - name: 3. Send Discord Notification
        shell: powershell
        env:
          RDP_PASSWORD: ${{ inputs.rdp_password }}
          DISCORD_TOKEN: ${{ inputs.discord_token }}
          DISCORD_CHANNEL_ID: ${{ inputs.discord_channel_id }}
        run: |
          # --- Lấy IP Tailscale (chờ tối đa ~60s) ---
          $tsExe = 'C:\Program Files\Tailscale\tailscale.exe'
          if (-not (Test-Path $tsExe)) { $tsExe = 'tailscale' }

          $tsIP = $null
          for ($i = 1; $i -le 12 -and -not $tsIP; $i++) {
              try { $tsIP = & $tsExe ip -4 | Select-Object -First 1 } catch { $tsIP = $null }
              if (-not $tsIP) { Start-Sleep -Seconds 5 }
          }
          if (-not $tsIP) { throw 'Could not get the Tailscale IP - check the auth key / Tailscale step.' }
          $tsIP = "$tsIP".Trim()
          Write-Host "Tailscale IP: $tsIP"

          # --- Soạn tin nhắn (dùng :shortcode: thay emoji để khỏi lỗi encoding) ---
          $bt = [string][char]96
          $content = @(
              ':rocket: **CLOUDTRKIEN RDP STARTED!**'
              '----------------------------------------------'
              ":round_pushpin: **IP:** $bt$tsIP$bt"
              ":bust_in_silhouette: **User:** ${bt}runneradmin${bt}"
              ":key: **Pass:** $bt$($env:RDP_PASSWORD)$bt"
              ':loud_sound: **Audio/Mic:** Enabled'
              ':zap: **Status:** Stable & Ready!'
          ) -join "`n"

          # --- Gửi Discord (retry 3 lần; lỗi thì cảnh báo nhưng KHÔNG làm chết runner) ---
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $json = @{ content = $content } | ConvertTo-Json -Compress
          $req = @{
              Uri         = 'https://discord.com/api/v10/channels/' + $env:DISCORD_CHANNEL_ID.Trim() + '/messages'
              Method      = 'Post'
              Headers     = @{ Authorization = 'Bot ' + $env:DISCORD_TOKEN.Trim() }
              UserAgent   = 'DiscordBot (https://github.com, 1.0)'
              ContentType = 'application/json; charset=utf-8'
              Body        = [System.Text.Encoding]::UTF8.GetBytes($json)
          }

          $sent = $false
          for ($n = 1; $n -le 3 -and -not $sent; $n++) {
              try {
                  Invoke-RestMethod @req | Out-Null
                  $sent = $true
                  Write-Host 'Discord notification sent.'
              } catch {
                  Write-Warning "Discord attempt $n/3 failed: $($_.Exception.Message)"
                  Start-Sleep -Seconds 5
              }
          }
          if (-not $sent) { Write-Warning 'Discord message NOT sent - use the Tailscale IP printed above.' }

      - name: 4. Keep Alive
        shell: powershell
        run: |
          # Chạy tới phút 345 rồi thoát êm (job xanh + Tailscale tự logout),
          # thay vì bị timeout 360 phút kill giữa chừng.
          $deadline = (Get-Date).AddMinutes(345)
          Write-Host "Keep-alive until $($deadline.ToString('HH:mm')) (runner time)"
          while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 300
              Write-Host ('alive ' + (Get-Date -Format 'HH:mm'))
          }
