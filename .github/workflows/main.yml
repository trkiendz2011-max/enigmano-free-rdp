name: Windows RDP Stable Final

on:
  workflow_dispatch:
    inputs:
      runner_os:
        description: 'Choose OS Version'
        required: true
        default: 'windows-2022'
        type: choice
        options:
          - windows-2022
          - windows-latest
      tailscale_authkey:
        description: 'Tailscale Auth Key'
        required: true
      discord_channel_id:
        description: 'Discord Channel ID'
        required: true
        default: '1413508445323133001'
      discord_token:
        description: 'Discord Bot Token'
        required: true
      rdp_password:
        description: 'Administrator Password'
        required: true
        default: 'KienDz@2026'

jobs:
  rdp-runner:
    runs-on: ${{ github.event.inputs.runner_os }}
    timeout-minutes: 360

    steps:
    - name: 1. Setup RDP and System
      shell: powershell
      run: |
        # Mở Remote Desktop và tường lửa
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

        # Đặt mật khẩu cho cả runneradmin và Administrator
        $pwd = "${{ github.event.inputs.rdp_password }}"
        try { net user runneradmin "$pwd" } catch {}
        try { 
            net user administrator /active:yes
            net user administrator "$pwd" 
        } catch {}

        # Bật dịch vụ Audio/Mic
        Set-Service -Name Audiosrv -StartupType Automatic
        Start-Service -Name Audiosrv
        Set-Service -Name AudioEndpointBuilder -StartupType Automatic
        Start-Service -Name AudioEndpointBuilder

    - name: 2. Tailscale Setup
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ github.event.inputs.tailscale_authkey }}
        hostname: cloudtrkien
        args: --advertise-exit-node=false

    - name: 3. Send Discord Notification
      shell: powershell
      run: |
        Start-Sleep -Seconds 10
        $tsIP = "Unknown"
        try {
            $tsIP = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4).Trim()
        } catch {}

        $rdpPass = "${{ github.event.inputs.rdp_password }}"
        $channelId = "${{ github.event.inputs.discord_channel_id }}"
        $botToken = "${{ github.event.inputs.discord_token }}"
        $userCode = '`Administrator` (hoặc `runneradmin`)'

        $content = "🚀 **CLOUDTRKIEN RDP STARTED!**`n" +
                   "----------------------------------------------`n" +
                   "📍 **IP:** $tsIP`n" +
                   "👤 **User:** $userCode`n" +
                   "🔑 **Pass:** $rdpPass`n" +
                   "🔊 **Audio/Mic:** Enabled`n" +
                   "⚡ **Status:** Stable & Ready!"

        $body = @{ content = $content } \vert{} ConvertTo-Json$headers = @{
            "Authorization" = "Bot $botToken"
            "Content-Type" = "application/json"
        }

        try {
            Invoke-RestMethod -Uri "https://discord.com/api/v10/channels/$channelId/messages" -Method Post -Headers $headers -Body$body
        } catch {}

    - name: 4. Keep Alive
      shell: powershell
      run: |
        while ($true) {
            Start-Sleep -Seconds 30
        }
