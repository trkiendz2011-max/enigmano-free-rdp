name: Windows RDP Ultra-Optimized (No Discord)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Optimize System Performance & Enable RDP
        shell: powershell
        run: |
          Write-Host "--- 1. Dynamic CPU & RAM Optimization ---"
          # Chuyển Power Plan sang High Performance
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          
          # Tắt dịch vụ ngầm ngốn CPU & RAM (SysMain, Windows Search, Update, Telemetry)
          $services = @("SysMain", "WSearch", "wuauserv", "DiagTrack", "MapsBroker", "dosvc")
          foreach ($s in $services) {
              Stop-Service -Name $s -Force -ErrorAction SilentlyContinue
              Set-Service -Name $s -StartupType Disabled -ErrorAction SilentlyContinue
          }

          # Tắt Windows Defender Real-time Protection để giảm 15-20% CPU
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

          # Tắt hiệu ứng hình ảnh Windows (Visual Effects) để RDP cực mượt
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name "UserPreferencesMask" -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00)) -ErrorAction SilentlyContinue

          Write-Host "--- 2. Enable & Optimize RDP ---"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-Service -Name "TermService" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "TermService" -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          Write-Host "--- 3. Configure Account Password ---"
          $pass = $env:RDP_PASS
          if ([string]::IsNullOrWhiteSpace($pass)) {
              $pass = "Admin@2026RDP!"
          }
          net user runneradmin $pass
          net localgroup Administrators runneradmin /add -ErrorAction SilentlyContinue
          
          Write-Host "RDP User: runneradmin | Password: $pass"
        env:
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}

      - name: Install & Connect Tailscale
        shell: powershell
        run: |
          Write-Host "Installing Tailscale..."
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $installer = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installer -UseBasicParsing
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait

          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsPath)) {
              $tsPath = "C:\Program Files (x86)\Tailscale\tailscale.exe"
          }

          $authKey = $env:TS_AUTH_KEY
          if (Test-Path $tsPath) {
              if (-not [string]::IsNullOrWhiteSpace($authKey)) {
                  & $tsPath up --authkey=$authKey --unattended --accept-routes
              } else {
                  Write-Warning "TAILSCALE_AUTH_KEY chưa được cài trong Secrets!"
              }
              
              $tsIp = "Chua_Ket_Noi"
              for ($i = 0; $i -lt 15; $i++) {
                  Start-Sleep -Seconds 2
                  $rawIp = & $tsPath ip -4 2>$null
                  if ($rawIp) {
                      $tsIp = $rawIp.Trim()
                      break
                  }
              }

              Write-Host "=========================================="
              Write-Host "TAILSCALE IP : $tsIp"
              Write-Host "=========================================="
          }
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Keep Alive (6 Hours)
        shell: powershell
        run: |
          for ($i = 0; $i -lt 360; $i++) {
              Start-Sleep -Seconds 60
          }
