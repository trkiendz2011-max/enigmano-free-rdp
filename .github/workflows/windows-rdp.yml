name: Windows RDP Tailscale & Discord Bot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install discord.py mss pillow psutil requests

      - name: Enable Remote Desktop (RDP) & Disable NLA
        shell: powershell
        run: |
          # 1. Bật RDP và tắt NLA để kết nối mượt từ mọi thiết bị
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-Service -Name "TermService" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "TermService" -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          # 2. Cài mật khẩu người dùng
          $pass = $env:RDP_PASS
          if ([string]::IsNullOrWhiteSpace($pass)) {
              $pass = "Admin@2026RDP!"
          }
          net user runneradmin $pass
          net localgroup Administrators runneradmin /add -ErrorAction SilentlyContinue
          Write-Host "Configured RDP user: runneradmin"
        env:
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}

      - name: Install & Connect Tailscale
        shell: powershell
        run: |
          Write-Host "Downloading Tailscale..."
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $installer = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installer -UseBasicParsing

          Write-Host "Installing Tailscale..."
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait

          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsPath)) {
              $tsPath = "C:\Program Files (x86)\Tailscale\tailscale.exe"
          }

          $authKey = $env:TS_AUTH_KEY
          if (Test-Path $tsPath) {
              if (-not [string]::IsNullOrWhiteSpace($authKey)) {
                  Write-Host "Connecting to Tailscale..."
                  & $tsPath up --authkey=$authKey --unattended --accept-routes
              } else {
                  Write-Warning "TAILSCALE_AUTH_KEY is not set in Secrets!"
              }
              
              # Vòng lặp chờ IP an toàn (Tránh lỗi Null Reference)
              $tsIp = ""
              for ($i = 0; $i -lt 15; $i++) {
                  Start-Sleep -Seconds 2
                  $rawIp = & $tsPath ip -4 2>$null
                  if ($rawIp) {
                      $tsIp = $rawIp.Trim()
                      break
                  }
              }

              Write-Host "=========================================="
              Write-Host "TAILSCALE IP: $tsIp"
              Write-Host "=========================================="
              "TAILSCALE_IP=$tsIp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
              Write-Error "Tailscale installation failed."
          }
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Write bot.py via Native PowerShell
        shell: powershell
        run: |
          $b64 = ""
          $bytes = [System.Convert]::FromBase64String($b64)
          [System.IO.File]::WriteAllBytes("C:\bot.py", $bytes)
          Write-Host "C:\bot.py generated successfully via native PowerShell."

      - name: Run Discord Bot & Keep RDP Alive
        shell: powershell
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TAILSCALE_IP: ${{ env.TAILSCALE_IP }}
          RDP_USER: "runneradmin"
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ($env:DISCORD_BOT_TOKEN) {
              Write-Host "Starting Discord Bot in background..."
              Start-Process -FilePath "python" -ArgumentList "C:\bot.py" -NoNewWindow
          } else {
              Write-Warning "DISCORD_BOT_TOKEN missing. Skipping bot start."
          }

          Write-Host "=========================================="
          Write-Host "RDP SERVER IS ACTIVE!"
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Username     : runneradmin"
          Write-Host "=========================================="

          # Giữ Workflow sống trong 6 tiếng
          for ($i = 0; $i -lt 360; $i++) {
              Start-Sleep -Seconds 60
          }
