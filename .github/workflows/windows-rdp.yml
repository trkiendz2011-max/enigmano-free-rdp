name: EnigMano RDP via Tailscale

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # === 1. TỔNG QUAN HỆ THỐNG ===
      - name: System Information
        run: |
          Write-Host "=== ENIGMANO RDP DEPLOYMENT ===" -ForegroundColor Green
          Write-Host "Instance Number: ${{ github.event.inputs.instance_number }}" -ForegroundColor Yellow
          Write-Host "Runner Name: $env:RUNNER_NAME" -ForegroundColor Yellow
          Write-Host "`n=== HARDWARE SPECS ===" -ForegroundColor Cyan
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, TotalVisibleMemorySize
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

      # === 2. CÀI ĐẶT PHẦN MỀM CHUẨN (DÙNG CURL TRÁNH ĐƠ) ===
      - name: Pre-install Essential Software
        run: |
          Write-Host "Installing Essential Apps via Chocolatey..." -ForegroundColor Green
          Set-ExecutionPolicy Bypass -Scope Process -Force
          choco install googlechrome 7zip -y --no-progress --ignore-checksums --force

      # === 3. CẤU HÌNH TÀI KHOẢN & BẬT RDP HOÀN HẢO ===
      - name: Enable RDP & Setup User Account
        run: |
          Write-Host "Setting up User Account & RDP Policy..." -ForegroundColor Green
          
          # Đảm bảo mật khẩu tài khoản runneradmin
          net user runneradmin "P@ssw0rd!" /add 2>$null
          net user runneradmin "P@ssw0rd!"
          net localgroup "Remote Desktop Users" runneradmin /add 2>$null
          net localgroup "Administrators" runneradmin /add 2>$null
          wmic useraccount where name='runneradmin' set PasswordExpires=False 2>$null

          # Mở RDP, tắt NLA để kết nối từ mọi thiết bị mượt mà
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          # Giữ Console Session mở liên tục (Sửa lỗi chụp màn hình đen khi ngắt RDP)
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name "DisableLockWorkstation" -Value 1

      # === 4. TỐI ƯU HIỆU NĂNG, MẠNG & ÂM THANH ===
      - name: Optimize System, Network & Audio
        run: |
          Write-Host "Optimizing Windows Performance..." -ForegroundColor Green
          
          # Tắt bớt các service tốn tài nguyên
          $services = @("wuauserv", "sysmain", "WSearch")
          foreach ($svc in $services) {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }
          
          # Bật Âm thanh qua RDP
          Set-Service -Name "AudioEndpointBuilder" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "AudioEndpointBuilder" -ErrorAction SilentlyContinue
          Set-Service -Name "Audiosrv" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "Audiosrv" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fDisableAudio" -Value 0

      # === 5. CÀI MESA3D (GIẢ LẬP GPU OPENGL) AN TOÀN ===
      - name: Install Mesa3D Software GPU
        run: |
          Write-Host "Downloading & Installing Mesa3D Software GPU..." -ForegroundColor Green
          try {
            $mesaUrl = "https://github.com/pal1000/mesa-dist-win/releases/download/23.1.5/mesa3d-23.1.5-release-msvc.7z"
            $outputZip = "$env:TEMP\mesa3d.7z"
            
            curl.exe -sSL "$mesaUrl" -o "$outputZip"
            if (Test-Path $outputZip) {
              & "C:\Program Files\7-Zip\7z.exe" x "$outputZip" -o"C:\Mesa3D" -y | Out-Null
              Write-Host "Mesa3D installed successfully!" -ForegroundColor Green
            }
          } catch {
            Write-Host "Mesa3D install skipped safely." -ForegroundColor Yellow
          }

      # === 6. CÀI ĐẶT & BẬT TAILSCALE ===
      - name: Install and Authenticate Tailscale
        id: get_ip
        run: |
          Write-Host "Installing Tailscale..." -ForegroundColor Green
          curl.exe -sSL "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -o "tailscale-setup.exe"
          Start-Process -FilePath "tailscale-setup.exe" -ArgumentList "/S" -Wait

          $authKey = "${{ secrets.TAILSCALE_AUTH_KEY }}"
          if ([string]::IsNullOrEmpty($authKey)) {
            Write-Host "::error::TAILSCALE_AUTH_KEY secret is not set!"
            exit 1
          }

          Write-Host "Connecting to Tailscale Network..." -ForegroundColor Green
          & "C:\Program Files\Tailscale\tailscale.exe" up --auth-key $authKey --accept-routes --hostname "github-rdp-${{ github.event.inputs.instance_number }}"

          # Lấy IP Tailscale
          $tailscaleIP = $null
          for ($i = 0; $i -lt 30; $i++) {
            $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4 2>$null
            if ($ip) {
              $tailscaleIP = $ip.Trim()
              break
            }
            Start-Sleep -Seconds 2
          }

          if ($tailscaleIP) {
            Write-Host "Tailscale IP: $tailscaleIP" -ForegroundColor Green
            
            # Đặt biến môi trường hệ thống để Bot Python luôn đọc được
            [System.Environment]::SetEnvironmentVariable("TAILSCALE_IP", $tailscaleIP, "Machine")
            [System.Environment]::SetEnvironmentVariable("DISCORD_BOT_TOKEN", "${{ secrets.DISCORD_BOT_TOKEN }}", "Machine")
            
            Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$tailscaleIP"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "ip=$tailscaleIP"
          } else {
            Write-Host "Failed to obtain Tailscale IP!" -ForegroundColor Red
            exit 1
          }

      # === 7. CAO CẤP: BOT DISCORD & WATCHDOG TỰ HỒI PHỤC ===
      - name: Setup & Launch Interactive Discord Bot
        shell: powershell
        run: |
          Write-Host "Installing Python Requirements..." -ForegroundColor Green
          python -m pip install --upgrade pip --quiet
          python -m pip install discord.py mss Pillow psutil --quiet

          Write-Host "Generating Discord Bot Code..." -ForegroundColor Green
          $pythonCode = @'
import os
import sys
import time
import asyncio
import discord
import psutil
from mss import mss
from discord.ext import commands, tasks
from discord.ui import Button, View

TOKEN = os.getenv("DISCORD_BOT_TOKEN")
TAILSCALE_IP = os.getenv("TAILSCALE_IP", "Unknown IP")

intents = discord.Intents.default()
intents.message_content = True

bot = commands.Bot(command_prefix="!", intents=intents)
start_time = time.time()
last_channel = None

async def send_file_action(target, file_path: str):
    if not os.path.exists(file_path):
        msg = f"❌ File không tồn tại: `{file_path}`"
        await (target.followup.send(msg) if isinstance(target, discord.Interaction) else target.send(msg))
        return

    file_size_mb = os.path.getsize(file_path) / (1024 * 1024)
    if file_size_mb > 25:
        msg = f"⚠️ File quá lớn (`{file_size_mb:.2f} MB`). Giới hạn Discord: **25 MB**."
        await (target.followup.send(msg) if isinstance(target, discord.Interaction) else target.send(msg))
        return

    try:
        file = discord.File(file_path)
        msg = f"📁 **File:** `{os.path.basename(file_path)}`"
        await (target.followup.send(content=msg, file=file) if isinstance(target, discord.Interaction) else target.send(content=msg, file=file))
    except Exception as e:
        err_msg = f"❌ Lỗi gửi file: `{str(e)}`"
        await (target.followup.send(err_msg) if isinstance(target, discord.Interaction) else target.send(err_msg))

async def capture_screen_action(target):
    try:
        shot_path = "C:\\screenshot.png"
        with mss() as sct:
            sct.shot(output=shot_path)
        
        file = discord.File(shot_path, filename="screenshot.png")
        embed = discord.Embed(title="🖼️ Màn hình RDP Hiện Tại", color=0x9b59b6)
        embed.set_image(url="attachment://screenshot.png")
        
        if isinstance(target, discord.Interaction):
            await target.followup.send(file=file, embed=embed)
        else:
            await target.send(file=file, embed=embed)
    except Exception as e:
        msg = f"❌ Không thể chụp màn hình: `{str(e)}`"
        if isinstance(target, discord.Interaction):
            await target.followup.send(msg)
        else:
            await target.send(msg)

async def show_specs_action(target):
    cpu_usage = psutil.cpu_percent(interval=1)
    ram = psutil.virtual_memory()
    
    disk_c = psutil.disk_usage("C:\\")
    disk_c_free = round(disk_c.free / (1024**3), 2)
    
    disk_d_str = "N/A"
    if os.path.exists("D:\\"):
        disk_d = psutil.disk_usage("D:\\")
        disk_d_str = f"{round(disk_d.free / (1024**3), 2)} GB"

    ram_used_gb = round(ram.used / (1024**3), 2)
    ram_total_gb = round(ram.total / (1024**3), 2)

    embed = discord.Embed(title="📊 TÌNH TRẠNG TÀI NGUYÊN MÁY ẢO", color=0xf1c40f)
    embed.add_field(name="⚡ CPU Usage", value=f"`{cpu_usage}%`", inline=True)
    embed.add_field(name="🧠 RAM Usage", value=f"`{ram_used_gb} GB / {ram_total_gb} GB ({ram.percent}%)`", inline=True)
    embed.add_field(name="💾 Disk (C:) Free", value=f"`{disk_c_free} GB`", inline=True)
    embed.add_field(name="💾 Disk (D:) Free", value=f"`{disk_d_str}`", inline=True)

    if isinstance(target, discord.Interaction):
        await target.followup.send(embed=embed)
    else:
        await target.send(embed=embed)

async def show_status_action(target):
    uptime_seconds = int(time.time() - start_time)
    hours, remainder = divmod(uptime_seconds, 3600)
    minutes, seconds = divmod(remainder, 60)
    uptime_str = f"{hours}h {minutes}m {seconds}s"

    embed = discord.Embed(title="🖥️ THÔNG TIN MÁY ẢO RDP", color=0x2ecc71)
    embed.add_field(name="🌐 Tailscale IP", value=f"`{TAILSCALE_IP}`", inline=True)
    embed.add_field(name="👤 Username", value="`runneradmin`", inline=True)
    embed.add_field(name="🔑 Password", value="`P@ssw0rd!`", inline=True)
    embed.add_field(name="⏱️ Uptime", value=f"`{uptime_str}`", inline=False)
    embed.set_footer(text="Giới hạn tối đa 6 tiếng / Workflow run")

    if isinstance(target, discord.Interaction):
        await target.followup.send(embed=embed)
    else:
        await target.send(embed=embed)

class RDPControlView(View):
    def __init__(self):
        super().__init__(timeout=None)

    @discord.ui.button(label="Status", style=discord.ButtonStyle.green, emoji="🖥️")
    async def status_button(self, interaction: discord.Interaction, button: Button):
        await interaction.response.defer()
        await show_status_action(interaction)

    @discord.ui.button(label="Screenshot", style=discord.ButtonStyle.primary, emoji="📸")
    async def screenshot_button(self, interaction: discord.Interaction, button: Button):
        await interaction.response.defer()
        await capture_screen_action(interaction)

    @discord.ui.button(label="Specs", style=discord.ButtonStyle.secondary, emoji="📊")
    async def specs_button(self, interaction: discord.Interaction, button: Button):
        await interaction.response.defer()
        await show_specs_action(interaction)

@tasks.loop(seconds=1, count=1)
async def timeout_warning_task():
    await asyncio.sleep(20700) # 5 tiếng 45 phút
    if last_channel:
        embed = discord.Embed(
            title="⚠️ CẢNH BÁO: MÁY ẢO SẮP TẮT!",
            description="Runner đã chạy được **5 tiếng 45 phút**. Máy sẽ ngắt kết nối sau **15 phút** nữa!",
            color=0xe74c3c
        )
        await last_channel.send(content="@everyone", embed=embed)

@bot.event
async def on_ready():
    print(f"Bot connected: {bot.user.name}")
    timeout_warning_task.start()
    
    for guild in bot.guilds:
        for channel in guild.text_channels:
            if channel.permissions_for(guild.me).send_messages:
                try:
                    embed = discord.Embed(
                        title="🚀 RDP ONLINE & SẴN SÀNG!",
                        description=f"Máy ảo vừa khởi động thành công.\n• Tailscale IP: `{TAILSCALE_IP}`\n• User: `runneradmin` | Pass: `P@ssw0rd!`",
                        color=0x2ecc71
                    )
                    await channel.send(embed=embed, view=RDPControlView())
                    global last_channel
                    last_channel = channel
                    break
                except:
                    continue
        if last_channel:
            break

@bot.command(name="menu")
async def show_menu(ctx):
    global last_channel
    last_channel = ctx.channel
    embed = discord.Embed(
        title="📋 HỆ THỐNG QUẢN LÝ RDP",
        description="Bấm nút bên dưới hoặc gõ lệnh:\n"
                    "• `!getfile <path>` - Tải file từ máy về Discord\n"
                    "• `!log` - Tải file log hệ thống",
        color=0x3498db
    )
    await ctx.send(embed=embed, view=RDPControlView())

@bot.command(name="getfile")
async def cmd_getfile(ctx, *, file_path: str):
    global last_channel
    last_channel = ctx.channel
    clean_path = file_path.strip('"').strip("'")
    await send_file_action(ctx, clean_path)

@bot.command(name="log")
async def cmd_log(ctx):
    global last_channel
    last_channel = ctx.channel
    await send_file_action(ctx, "C:\\bot_app.log")

@bot.command(name="status")
async def cmd_status(ctx):
    global last_channel
    last_channel = ctx.channel
    await show_status_action(ctx)

@bot.command(aliases=["cap", "screenshot"])
async def cmd_screenshot(ctx):
    global last_channel
    last_channel = ctx.channel
    await capture_screen_action(ctx)

@bot.command(name="specs")
async def cmd_specs(ctx):
    global last_channel
    last_channel = ctx.channel
    await show_specs_action(ctx)

if __name__ == "__main__":
    if TOKEN:
        bot.run(TOKEN)
    else:
        print("Error: DISCORD_BOT_TOKEN is empty!")
'@
          Set-Content -Path "C:\discord_bot.py" -Value $pythonCode -Encoding UTF8

          # Khởi chạy Bot Python với Output Log
          Start-Process python -ArgumentList "C:\discord_bot.py" -RedirectStandardOutput "C:\bot_app.log" -RedirectStandardError "C:\bot_app.log" -WindowStyle Hidden

          # Watchdog thông minh kiểm tra định kỳ 15 giây
          $watchdogCode = @'
          while ($true) {
              $proc = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*discord_bot.py*" }
              if (-not $proc) {
                  Start-Process python -ArgumentList "C:\discord_bot.py" -RedirectStandardOutput "C:\bot_app.log" -RedirectStandardError "C:\bot_app.log" -WindowStyle Hidden
              }
              Start-Sleep -Seconds 15
          }
'@
          Set-Content -Path "C:\watchdog.ps1" -Value $watchdogCode -Encoding UTF8
          Start-Process powershell -ArgumentList "-ExecutionPolicy Bypass -File C:\watchdog.ps1" -WindowStyle Hidden

      # === 8. DUY TRÌ RUNNER & DỌN DẸP BỘ NHỚ RAM CHUYÊN SÂU (WIN32 API) ===
      - name: Keep Session Alive & Win32 Memory Cleaner
        run: |
          Write-Host "`n=== RDP SESSION IS ACTIVE & RUNNING (MAX 6 HOURS) ===" -ForegroundColor Green
          
          # Biên dịch hàm Win32 API dọn RAM thực sự cho Windows
          $code = @'
          using System;
          using System.Runtime.InteropServices;
          public class MemoryCleaner {
              [DllImport("kernel32.dll")]
              public static extern bool SetProcessWorkingSetSize(IntPtr proc, IntPtr min, IntPtr max);
              public static void TrimAll() {
                  foreach (System.Diagnostics.Process p in System.Diagnostics.Process.GetProcesses()) {
                      try { SetProcessWorkingSetSize(p.Handle, (IntPtr)(-1), (IntPtr)(-1)); }
                      catch {}
                  }
              }
          }
'@
          Add-Type -TypeDefinition $code -ErrorAction SilentlyContinue

          $counter = 0
          while ($true) {
            $counter++
            [MemoryCleaner]::TrimAll()
            Write-Host "Heartbeat #$counter - System Active & RAM Cleaned - ($(Get-Date))" -ForegroundColor Cyan
            Start-Sleep -Seconds 300
          }
