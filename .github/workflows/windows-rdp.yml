name: Windows RDP Master Stable

on:
  workflow_dispatch:
    inputs:
      runner_os:
        description: 'Choose OS Version'
        required: true
        default: 'windows-2022'
        type: choice
        options:
          - windows-2022
          - windows-latest
      tailscale_authkey:
        description: 'Tailscale Auth Key'
        required: true
      discord_channel_id:
        description: 'Discord Channel ID'
        required: true
        default: '1413508445323133001'
      discord_token:
        description: 'Discord Bot Token'
        required: true
      rdp_password:
        description: 'Administrator Password'
        required: true
        default: 'KienDz@2026'

jobs:
  rdp-runner:
    runs-on: ${{ github.event.inputs.runner_os }}
    timeout-minutes: 360

    steps:
    - name: 1. Setup RDP and Audio
      shell: powershell
      run: |
        Write-Host "Configuring Remote Desktop..."
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

        Write-Host "Setting Administrator password..."
        $pwd = '${{ github.event.inputs.rdp_password }}'
        net user administrator $pwd

        Write-Host "Enabling Audio services..."
        Set-Service -Name Audiosrv -StartupType Automatic -ErrorAction SilentlyContinue
        Start-Service -Name Audiosrv -ErrorAction SilentlyContinue
        Set-Service -Name AudioEndpointBuilder -StartupType Automatic -ErrorAction SilentlyContinue
        Start-Service -Name AudioEndpointBuilder -ErrorAction SilentlyContinue
        Write-Host "Setup completed successfully!"

    - name: 2. Tailscale Setup
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ github.event.inputs.tailscale_authkey }}
        hostname: cloudtrkien
        args: --advertise-exit-node=false

    - name: 3. Send Discord Notification
      shell: powershell
      run: |
        Start-Sleep -Seconds 10
        try {
            $tsIP = (tailscale ip -4).Trim()
        } catch {
            $tsIP = "Could not retrieve IP"
        }

        $adminUser = "administrator"
        $rdpPass = '${{ github.event.inputs.rdp_password }}'
        $channelId = '${{ github.event.inputs.discord_channel_id }}'
        $botToken = '${{ github.event.inputs.discord_token }}'

        $content = "🚀 **CLOUDTRKIEN RDP STARTED!**`n" +
                   "----------------------------------------------`n" +
                   "📍 **IP:** $tsIP`n" +
                   "👤 **User:** ``$adminUser```n" +
                   "🔑 **Pass:** $rdpPass`n" +
                   "⚡ **Status:** Stable & Ready!"

        $payload = @{
            content = $content
        } | ConvertTo-Json

        $headers = @{
            "Authorization" = "Bot $botToken"
            "Content-Type" = "application/json"
        }

        try {
            Invoke-RestMethod -Uri "[https://discord.com/api/v10/channels/$channelId/messages](https://discord.com/api/v10/channels/$channelId/messages)" -Method Post -Headers $headers -Body $payload
            Write-Host "Discord notification sent successfully!"
        } catch {
            Write-Host "Failed to send Discord notification: $_"
        }

    - name: 4. Keep Alive
      shell: powershell
      run: |
        Write-Host "RDP runner is active and keeping alive..."
        while ($true) {
            Start-Sleep -Seconds 30
        }
