name: EnigMano RDP via Tailscale

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: System Information
        run: |
          Write-Host "=== ENIGMANO RDP DEPLOYMENT ===" -ForegroundColor Green
          Write-Host "Instance Number: ${{ github.event.inputs.instance_number }}" -ForegroundColor Yellow
          Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Yellow
          Write-Host "Workflow: $env:GITHUB_WORKFLOW" -ForegroundColor Yellow
          Write-Host "`n=== SYSTEM SPECIFICATIONS ===" -ForegroundColor Cyan
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, TotalPhysicalMemory
          Get-WmiObject -Class Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

      - name: Enable RDP
        run: |
          Write-Host "Enabling Remote Desktop..." -ForegroundColor Green
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

      - name: Create User Account
        run: |
          Write-Host "Setting up user account..." -ForegroundColor Green
          $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin"
          Write-Host "Username: runneradmin" -ForegroundColor Yellow
          Write-Host "Password: P@ssw0rd!" -ForegroundColor Yellow

      - name: Install Tailscale
        run: |
          Write-Host "Installing Tailscale..." -ForegroundColor Green
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath "tailscale-setup.exe" -ArgumentList "/S" -Wait
          Write-Host "Tailscale installed successfully!" -ForegroundColor Green

      - name: Authenticate Tailscale
        id: tailscale_auth
        run: |
          Write-Host "Authenticating Tailscale..." -ForegroundColor Green
          $authKey = "${{ secrets.TAILSCALE_AUTH_KEY }}"
          if ([string]::IsNullOrEmpty($authKey)) {
            Write-Host "::error::TAILSCALE_AUTH_KEY secret is not set!"
            exit 1
          }
          Start-Process -FilePath "C:\Program Files\Tailscale\tailscale.exe" -ArgumentList "up --auth-key $authKey --accept-routes" -Wait
          Write-Host "Tailscale authenticated successfully!" -ForegroundColor Green

      - name: Get Tailscale IP with Retry
        id: get_ip
        run: |
          Write-Host "Waiting for Tailscale IP..." -ForegroundColor Green
          $tailscaleIP = $null
          $retries = 0
          $maxRetries = 30
          while ($retries -lt $maxRetries) {
            $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4 2>$null
            if ($ip) {
              $tailscaleIP = $ip.Trim()
              Write-Host "Tailscale IP obtained: $tailscaleIP" -ForegroundColor Green
              break
            }
            Write-Host "Waiting for Tailscale IP... attempt $($retries+1)/$maxRetries" -ForegroundColor Yellow
            Start-Sleep -Seconds 3
            $retries++
          }
          if ($tailscaleIP) {
            Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$tailscaleIP"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "ip=$tailscaleIP"
          } else {
            Write-Host "::error::Could not obtain Tailscale IP after $maxRetries attempts."
            Write-Host "Dumping Tailscale status for debugging:"
            & "C:\Program Files\Tailscale\tailscale.exe" status
            exit 1
          }

      - name: Show Connection Details
        if: success()
        run: |
          $tailscaleIP = "${{ steps.get_ip.outputs.ip }}"
          Write-Host "`n=== CONNECTION DETAILS ===" -ForegroundColor Green
          Write-Host "╔══════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║         TAILSCALE RDP ACCESS          ║" -ForegroundColor Cyan
          Write-Host "╠══════════════════════════════════════╣" -ForegroundColor Cyan
          Write-Host "║ IP: $tailscaleIP" -ForegroundColor White
          Write-Host "║ Username: runneradmin                ║" -ForegroundColor White
          Write-Host "║ Password: P@ssw0rd!                  ║" -ForegroundColor White
          Write-Host "╚══════════════════════════════════════╝" -ForegroundColor Cyan

          Write-Host "`nConnection Instructions:" -ForegroundColor Yellow
          Write-Host "1. Install Tailscale on your device" -ForegroundColor White
          Write-Host "2. Login with the same Tailscale account" -ForegroundColor White
          Write-Host "3. Open Remote Desktop Connection" -ForegroundColor White
          Write-Host "4. Enter the Tailscale IP address above" -ForegroundColor White
          Write-Host "5. Username: runneradmin | Password: P@ssw0rd!" -ForegroundColor White
          Write-Host "6. IMPORTANT: Minimize (don't close) this window to keep connection alive!" -ForegroundColor Red

      - name: Keep Session Alive
        run: |
          Write-Host "`n=== SESSION ACTIVE ===" -ForegroundColor Green
          Write-Host "EnigMano RDP instance is now running!" -ForegroundColor Cyan
          Write-Host "Instance will remain active for up to 6 hours." -ForegroundColor Yellow
          Write-Host "Do not close this window to maintain the connection." -ForegroundColor Red
          $counter = 0
          while ($true) {
            $counter++
            Write-Host "Session active - Heartbeat #$counter ($(Get-Date))" -ForegroundColor Green
            Start-Sleep -Seconds 60
          }
