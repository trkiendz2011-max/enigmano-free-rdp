name: Windows Server 2022 RDP (Balanced)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
    # ========== 1. TỐI ƯU VỪA PHẢI ==========
    - name: Tối ưu hệ thống
      run: |
        # Tắt vài dịch vụ nền không cần thiết (an toàn)
        $svc = @("SysMain","Spooler","DiagTrack","WSearch")
        foreach ($s in $svc) {
          Set-Service -Name $s -StartupType Disabled -ErrorAction SilentlyContinue
          Stop-Service -Name $s -Force -ErrorAction SilentlyContinue
        }

        # Tắt telemetry (nhẹ, không ảnh hưởng bảo mật)
        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection' -Name "AllowTelemetry" -Value 0 -ErrorAction SilentlyContinue

        # Tắt hiệu ứng hình ảnh cho UI mượt hơn
        Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2 -ErrorAction SilentlyContinue

        # Tắt transparency
        Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name "EnableTransparency" -Value 0 -ErrorAction SilentlyContinue

    # ========== 2. TỐI ƯU RDP ==========
    - name: Tối ưu RDP
      run: |
        # Bật RDP
        Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

        # FPS ~60
        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\DWM' -Name "DwmFrameInterval" -Value 16 -Type DWord
        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\DWM' -Name "DwmMaxQueuedBuffers" -Value 16 -Type DWord

        # Ưu tiên băng thông RDP
        Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\TermDD' -Name "FlowControlDisable" -Value 1 -Type DWord

        # Không tự ngắt session
        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "MaxIdleTime" -Value 0 -Type DWord -ErrorAction SilentlyContinue

    # ========== 3. USER + FIREWALL ==========
    - name: Cấu hình User
      run: |
        $pass = ConvertTo-SecureString "P@ssw0rd_RDP_2024!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $pass
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    # ========== 4. CHROME ==========
    - name: Kiểm tra Chrome
      run: |
        $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe"
        if (Test-Path $chrome) {
          Write-Host "Chrome OK:"; & $chrome --version
        } else {
          choco install googlechrome -y --no-progress
        }

        # Shortcut Chrome ra Desktop
        $ws = New-Object -ComObject WScript.Shell
        $sc = $ws.CreateShortcut("C:\Users\runneradmin\Desktop\Google Chrome.lnk")
        $sc.TargetPath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
        $sc.Save()

    # ========== 5. NGROK ==========
    - name: Chạy Ngrok
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip
        .\ngrok\ngrok.exe authtoken $Env:NGROK_AUTH_TOKEN
        Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389" -NoNewWindow

        Start-Sleep -Seconds 15
        try {
          $info = Invoke-RestMethod http://127.0.0.1:4040/api/tunnels
          Write-Host "=====================================" -ForegroundColor Green
          Write-Host " RDP : $($info.tunnels[0].public_url)" -ForegroundColor Yellow
          Write-Host " USER: runneradmin" -ForegroundColor Yellow
          Write-Host " PASS: P@ssw0rd_RDP_2024!" -ForegroundColor Yellow
          Write-Host "=====================================" -ForegroundColor Green
        } catch { Write-Host "Xem log ngrok ở trên" }

        # Keep-alive 5h50
        $end = (Get-Date).AddMinutes(350)
        while ((Get-Date) -lt $end) {
          Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Session alive..."
          Start-Sleep -Seconds 60
        }
