name: Windows RDP Workflow

on:
  workflow_dispatch:

jobs:
  rdp-run:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Enable RDP and Configure Account
        shell: powershell
        env:
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0
          Set-Service -Name 'TermService' -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name 'TermService' -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue

          $pass = $env:RDP_PASS
          if ([string]::IsNullOrWhiteSpace($pass)) {
              $pass = "Admin@2026RDP!"
          }
          net user runneradmin $pass
          net localgroup Administrators runneradmin /add -ErrorAction SilentlyContinue

      - name: Optimize System Performance
        shell: powershell
        run: |
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          Stop-Service -Name SysMain -Force -ErrorAction SilentlyContinue
          Set-Service -Name SysMain -StartupType Disabled -ErrorAction SilentlyContinue
          Stop-Service -Name WSearch -Force -ErrorAction SilentlyContinue
          Set-Service -Name WSearch -StartupType Disabled -ErrorAction SilentlyContinue

      - name: Install and Setup Tailscale
        shell: powershell
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $installer = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile $installer -UseBasicParsing
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait

          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsPath)) {
              $tsPath = "C:\Program Files (x86)\Tailscale\tailscale.exe"
          }

          if ($env:TS_KEY) {
              & $tsPath up --authkey=$env:TS_KEY --unattended --accept-routes
          }

          Start-Sleep -Seconds 5
          $ip = (& $tsPath ip -4 2>$null)
          Write-Host "Tailscale IP: $ip"

      - name: Keep Workflow Alive
        shell: powershell
        run: |
          for ($i = 0; $i -lt 360; $i++) {
              Start-Sleep -Seconds 60
          }
