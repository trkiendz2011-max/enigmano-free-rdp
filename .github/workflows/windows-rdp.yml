name: Windows RDP Stable

on:
  workflow_dispatch:
    inputs:
      runner_os:
        description: 'Choose OS Version'
        required: true
        default: 'windows-2022'
        type: choice
        options:
          - windows-2022
          - windows-latest
      tailscale_authkey:
        description: 'Tailscale Auth Key'
        required: true
      discord_channel_id:
        description: 'Discord Channel ID'
        required: true
        default: '1413508445323133001'
      discord_token:
        description: 'Discord Bot Token'
        required: true
      rdp_password:
        description: 'Administrator Password'
        required: true
        default: 'KienDz@2026'

jobs:
  rdp-runner:
    runs-on: ${{ github.event.inputs.runner_os }}
    timeout-minutes: 360

    steps:
    - name: 1. Setup RDP and Audio
      shell: powershell
      run: |
        # Mở Remote Desktop và cấu hình tường lửa
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        
        # Đặt mật khẩu Administrator
        $pass = "${{ github.event.inputs.rdp_password }}"
        net user administrator $pass
        
        # Bật dịch vụ âm thanh (Audio/Microphone)
        Set-Service -Name Audiosrv -StartupType Automatic
        Start-Service -Name Audiosrv
        Set-Service -Name AudioEndpointBuilder -StartupType Automatic
        Start-Service -Name AudioEndpointBuilder
        
        Write-Host "Cau hinh RDP va Audio thanh cong!"

    - name: 2. Tailscale Setup (Host: cloudtrkien)
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ github.event.inputs.tailscale_authkey }}
        hostname: cloudtrkien
        args: --advertise-exit-node=false

    - name: 3. Send Notification to Discord
      shell: powershell
      run: |
        Start-Sleep -Seconds 5
        $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
        $uCode = '`administrator`'
        
        $msg = "🚀 **CLOUDTRKIEN RDP STARTED!**`n" +
               "----------------------------------------------`n" +
               "📍 **IP:** $tsIP`n" +
               "👤 **User:** $uCode`n" +
               "🔑 **Pass:** ${{ github.event.inputs.rdp_password }}`n" +
               "⚡ **Status:** Stable & Ready!"
        
        $headers = @{
            "Authorization" = "Bot ${{ github.event.inputs.discord_token }}"
            "Content-Type" = "application/json"
        }
        $body = @{
            content = $msg
        } | ConvertTo-Json
        
        try {
            Invoke-RestMethod -Uri "https://discord.com/api/v10/channels/${{ github.event.inputs.discord_channel_id }}/messages" -Method Post -Headers $headers -Body$body
        } catch {}

    - name: 4. Keep Alive
      shell: powershell
      run: |
        Write-Host "May ao dang chay on dinh..."
        while ($true) {
            Start-Sleep -Seconds 30
        }
