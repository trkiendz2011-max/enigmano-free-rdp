name: EnigMano RDP via Tailscale

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. TỐI ƯU DUNG LƯỢNG Ổ CỨNG MAX
      - name: Free Disk Space (Maximized)
        run: |
          Write-Host "Freeing up maximum disk space..." -ForegroundColor Green
          $targets = @(
            "C:\Program Files\dotnet",
            "C:\Program Files\Android",
            "C:\Program Files\Java",
            "C:\hostedtoolcache\windows",
            "C:\ProgramData\Chocolatey",
            "C:\Julia",
            "C:\Haskell"
          )
          foreach ($target in $targets) {
            if (Test-Path $target) {
              Remove-Item -Recurse -Force $target -ErrorAction SilentlyContinue
            }
          }
          Clear-RecycleBin -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
          $freeGB = [math]::Round($disk.FreeSpace / 1GB, 2)
          Write-Host "Available Space on C: drive: $freeGB GB" -ForegroundColor Cyan

      # 3. TỰ ĐỘNG CÀI SẴN PHẦN MỀM NỀN (Tùy chỉnh chọn phần mềm)
      - name: Pre-install Essential Software
        run: |
          Write-Host "Installing Chocolatey & Apps..." -ForegroundColor Green
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          
          # Cài đặt sẵn Chrome & 7-Zip (Có thể thêm/bớt app tùy nhu cầu)
          choco install googlechrome 7zip -y --no-progress

      - name: Optimize System Performance
        run: |
          Write-Host "Optimizing System Performance..." -ForegroundColor Green
          Stop-Service -Name "wuauserv", "sysmain", "WSearch" -ErrorAction SilentlyContinue
          Set-Service -Name "wuauserv", "sysmain", "WSearch" -StartupType Disabled -ErrorAction SilentlyContinue
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name VisualFXSetting -Value 2

      - name: Enable RDP
        run: |
          Write-Host "Enabling Remote Desktop..." -ForegroundColor Green
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

      - name: Create User Account
        run: |
          Write-Host "Setting up user account..." -ForegroundColor Green
          $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin"

      - name: Install Tailscale
        run: |
          Write-Host "Installing Tailscale..." -ForegroundColor Green
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath "tailscale-setup.exe" -ArgumentList "/S" -Wait

      - name: Authenticate Tailscale
        id: tailscale_auth
        run: |
          Write-Host "Authenticating Tailscale..." -ForegroundColor Green
          $authKey = "${{ secrets.TAILSCALE_AUTH_KEY }}"
          if ([string]::IsNullOrEmpty($authKey)) {
            Write-Host "::error::TAILSCALE_AUTH_KEY secret is not set!"
            exit 1
          }
          Start-Process -FilePath "C:\Program Files\Tailscale\tailscale.exe" -ArgumentList "up --auth-key $authKey --accept-routes" -Wait

      - name: Get Tailscale IP with Retry
        id: get_ip
        run: |
          Write-Host "Waiting for Tailscale IP..." -ForegroundColor Green
          $tailscaleIP = $null
          $retries = 0
          $maxRetries = 30
          while ($retries -lt $maxRetries) {
            $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4 2>$null
            if ($ip) {
              $tailscaleIP = $ip.Trim()
              break
            }
            Start-Sleep -Seconds 3
            $retries++
          }
          if ($tailscaleIP) {
            Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$tailscaleIP"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "ip=$tailscaleIP"
          } else {
            exit 1
          }

      - name: Show Connection Details
        if: success()
        run: |
          $tailscaleIP = "${{ steps.get_ip.outputs.ip }}"
          Write-Host "`n=== CONNECTION DETAILS ===" -ForegroundColor Green
          Write-Host "IP: $tailscaleIP" -ForegroundColor White
          Write-Host "Username: runneradmin | Password: P@ssw0rd!" -ForegroundColor White

      - name: Keep Session Alive
        run: |
          Write-Host "`n=== SESSION ACTIVE ===" -ForegroundColor Green
          $counter = 0
          while ($true) {
            $counter++
            Write-Host "Session active - Heartbeat #$counter ($(Get-Date))" -ForegroundColor Green
            Start-Sleep -Seconds 60
          }
